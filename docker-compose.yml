services:
  zwift-map-merge:
    # Published on each GitHub release. Pin a version (e.g. :0.1.0) instead of :latest if you prefer.
    image: ghcr.io/jeffs24/zwift-map-merge:latest
    # To build from source instead, comment out `image` above and uncomment:
    # build: .
    container_name: zwift-map-merge
    restart: unless-stopped
    ports:
      - "8126:8126"   # 8123 = Home Assistant, 8124 = liftosaur2garmin
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data

