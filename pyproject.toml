[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zwift-map-merge"
version = "0.2.0"
description = "Adds the map of a Zwift activity to the watch activity (full data) directly in Garmin Connect"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "garminconnect==0.3.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
zwift-map-merge = "zwift_map_merge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zwift_map_merge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
